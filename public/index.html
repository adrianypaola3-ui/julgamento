<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>⚖️ Tribunal Virtual — Julgamento Online</title>
</head>
<body>

    <div class="container">
        <!-- TELA 1: MENU -->
        <div id="screen-menu" class="screen active">
            <h1>Tribunal Virtual</h1>
            <input type="text" id="nickname" placeholder="Digite seu Nickname..." autocomplete="off">
            <input type="text" id="roomNameInput" placeholder="Nome da Sala a criar..." autocomplete="off">
            
            <!-- SELEÇÃO DE AVATAR (FOTO DE PERFIL) -->
            <div class="profile-selection">
                <p style="font-size: 0.9rem; color: var(--system-text); margin-bottom: 8px;">Escolha seu Personagem:</p>
                <div class="avatar-grid">
                    <img src="icone-1.png" alt="Personagem 1" class="avatar-option selected" onclick="selectAvatar('icone-1.png', this)">
                    <img src="icone-2.png" alt="Personagem 2" class="avatar-option" onclick="selectAvatar('icone-2.png', this)">
                    <img src="icone-3.png" alt="Personagem 3" class="avatar-option" onclick="selectAvatar('icone-3.png', this)">
                    <img src="icone-4.png" alt="Personagem 4" class="avatar-option" onclick="selectAvatar('icone-4.png', this)">
                    <img src="icone-5.png" alt="Personagem 5" class="avatar-option" onclick="selectAvatar('icone-5.png', this)">
                </div>
            </div>

            <button onclick="criarSala()">Criar Nova Sala</button>
            
            <p style="margin: 25px 0 10px 0; font-size: 0.9rem; color: var(--system-text);">Salas Disponíveis:</p>
            <div class="room-list" id="roomList"></div>
        </div>

        <!-- TELA 2: CASO -->
        <div id="screen-case" class="screen">
            <h2>Cenário do Caso</h2>
            <div class="case-box">
                <span class="label-info">Tema Central:</span>
                <h3 id="themeTitle"></h3>
                
                <span class="label-info" style="margin-top: 15px;">Título do Cenário:</span>
                <h4 id="caseTitle"></h4>
                
                <span class="label-info" style="margin-top: 15px;">Descrição Completa:</span>
                <p id="caseDescription"></p>
            </div>
            <button onclick="irParaChat()">Iniciar Julgamento</button>
        </div>

        <!-- TELA 3: CHAT MULTIPLAYER -->
        <div id="screen-chat" class="screen">
            <h2 id="chatRoomTitle" style="font-size: 1.1rem; margin-bottom: 5px; text-align: center;"></h2>
            <div class="papel-badge" id="papelBadge">Conectando...</div>
            
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="userInput" placeholder="Digite sua mensagem..." autocomplete="off" onkeypress="handleKeyPress(event)">
                    <button onclick="enviarMensagem()">Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Importação obrigatória do Socket.io do Servidor -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Script de Integração com Servidor e Banco de Dados -->
    <script>
        const socket = io();

        let currentUser = "";
        let currentRoom = "";
        let currentCase = {};
        let meuPapel = "";
        let selectedAvatarImg = "icone-1.png"; // Avatar padrão inicial

        function selectAvatar(imageName, element) {
            selectedAvatarImg = imageName;
            document.querySelectorAll('.avatar-option').forEach(img => {
                img.classList.remove('selected');
            });
            element.classList.add('selected');
        }

        function criarSala() {
            const nick = document.getElementById("nickname").value.trim();
            const nomeSala = document.getElementById("roomNameInput").value.trim();
            
            if (!nick || !nomeSala) {
                alert("Preencha seu nick e o nome da sala!");
                return;
            }
            currentUser = nick;

            // Envia o pedido para o servidor criar a sala no MongoDB
            socket.emit('criar_sala', { nomeSala, nick });
        }

        // Resposta do servidor quando a sala é criada com sucesso
        socket.on('sala_criada', ({ nomeSala, caso, papel }) => {
            currentRoom = nomeSala;
            currentCase = caso;
            meuPapel = papel;
            
            preencherCaso(caso);
            mudarTela("screen-case");
        });

        // Atualiza dinamicamente a lista de salas vindas do MongoDB
        socket.on('atualizar_salas', (salas) => {
            const roomListDiv = document.getElementById("roomList");
            roomListDiv.innerHTML = "";

            if (Object.keys(salas).length === 0) {
                roomListDiv.innerHTML = "<p style='color: var(--system-text); font-size: 0.85rem;'>Nenhuma sala ativa no momento.</p>";
                return;
            }

            for (let nomeSala in salas) {
                const dadosSala = salas[nomeSala];
                const item = document.createElement("div");
                item.className = "room-item";
                item.style.cssText = "display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 10px; margin-bottom: 8px; border-radius: 6px;";
                
                item.innerHTML = `
                    <span style="color: #fff;">${nomeSala} (Criador: ${dadosSala.criador})</span>
                    <button onclick="entrarNaSala('${nomeSala}')" style="padding: 6px 12px; cursor: pointer;">Entrar (${dadosSala.jogadores.length}/2)</button>
                `;
                roomListDiv.appendChild(item);
            }
        });

        function entrarNaSala(nomeSala) {
            const nick = document.getElementById("nickname").value.trim();
            if (!nick) {
                alert("Digite seu nickname no campo acima antes de entrar!");
                return;
            }
            currentUser = nick;
            socket.emit('entrar_sala', { nomeSala, nick });
        }

        // Resposta quando entra em uma sala existente
        socket.on('entrou_na_sala', ({ nomeSala, caso, papel }) => {
            currentRoom = nomeSala;
            currentCase = caso;
            meuPapel = papel;

            preencherCaso(caso);
            mudarTela("screen-case");
        });

        socket.on('erro', (mensagem) => {
            alert(mensagem);
        });

        function preencherCaso(caso) {
            document.getElementById("themeTitle").innerText = caso.tema;
            document.getElementById("caseTitle").innerText = caso.titulo;
            document.getElementById("caseDescription").innerText = caso.texto;
        }

        function irParaChat() {
            mudarTela("screen-chat");
            document.getElementById("chatRoomTitle").innerText = `Sala: ${currentRoom} — ${currentCase.titulo}`;
            
            const badge = document.getElementById("papelBadge");
            if (meuPapel === 'defesa') {
                badge.innerText = "Você é a DEFESA (🟢 Verde)";
            } else if (meuPapel === 'acusacao') {
                badge.innerText = "Você é a ACUSAÇÃO (🔴 Vermelho)";
            } else {
                badge.innerText = "Você é um ESPECTADOR (⚖️)";
            }

            document.getElementById("chatMessages").innerHTML = "";
            adicionarMensagemChat("Sistema", "Sessão aberta. O tribunal está em ordem.", "juiz");
        }

        function adicionarMensagemChat(autor, texto, tipo) {
            const chatMessages = document.getElementById("chatMessages");
            const div = document.createElement("div");
            
            if (tipo === 'defesa') {
                div.className = "message msg-defesa";
                div.innerHTML = `
                    <img src="${selectedAvatarImg}" alt="Avatar" class="chat-avatar">
                    <div class="chat-text-content"><strong>🟢 [Defesa] ${autor}:</strong> ${texto}</div>
                `;
            } else if (tipo === 'acusacao') {
                div.className = "message msg-acusacao";
                div.innerHTML = `
                    <div class="chat-text-content"><strong>🔴 [Acusação] ${autor}:</strong> ${texto}</div>
                `;
            } else {
                div.className = "message msg-juiz";
                div.innerHTML = `
                    <div class="chat-text-content"><strong>⚖️ [Sistema/Juiz]:</strong> ${texto}</div>
                `;
            }

            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function enviarMensagem() {
            const input = document.getElementById("userInput");
            const texto = input.value.trim();
            if (!texto) return;

            // Envia a mensagem via Socket.io para todos na mesma sala no servidor
            socket.emit('enviar_mensagem', { 
                nomeSala: currentRoom, 
                nick: currentUser, 
                texto, 
                papel: meuPapel 
            });

            input.value = "";
        }

        // Recebe mensagens em tempo real enviadas por qualquer dispositivo na sala
        socket.on('receber_mensagem', ({ nick, texto, papel }) => {
            adicionarMensagemChat(nick, texto, papel);
        });

        socket.on('mensagem_sistema', (aviso) => {
            adicionarMensagemChat("Sistema", aviso, "juiz");
        });

        function handleKeyPress(event) {
            if (event.key === 'Enter') enviarMensagem();
        }

        function mudarTela(id) {
            document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
            document.getElementById(id).classList.add("active");
        }
    </script>
</body>
</html>
